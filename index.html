<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#dbe6f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<title>재고 시스템 최종버전</title>
<style>
body{margin:0;background:#f7f9fc;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#334155;}
.app{width:100%;min-height:100vh;background:linear-gradient(180deg,#fcfdff 0%,#f7f9fc 100%);display:flex;flex-direction:column;}
.top-bar{background:rgba(255,255,255,.92);backdrop-filter:blur(6px);padding:12px;display:flex;flex-direction:column;gap:10px;align-items:stretch;border-bottom:1px solid #e5ebf3;box-shadow:0 8px 24px rgba(148,163,184,.18);}
.zone-tabs{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;overflow-x:auto;padding:8px;background:#ffffff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 20px rgba(148,163,184,.12);-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.zone-btn{font-size:15px;color:#334155;padding:7px 12px;min-height:44px;border-radius:10px;border:1px solid #e2e8f0;background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(148,163,184,.18);white-space:nowrap;word-break:keep-all;flex:0 0 auto;}
.zone-btn.active{font-weight:700;color:#0f172a;background:linear-gradient(180deg,#ffffff 0%,#eef4ff 100%);border-color:#cbdaf8;box-shadow:0 6px 16px rgba(59,130,246,.2);}
.zone-divider{color:#c0cddd;font-size:14px;user-select:none;}
.control-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.control-row.compact{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.control-btn{color:#1e293b;padding:7px 12px;min-height:44px;border:1px solid #e2e8f0;border-radius:10px;background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 10px rgba(148,163,184,.16);font-size:14px;font-weight:600;}
.control-btn.board-action,.control-btn.clip-action,.control-btn.primary-action{background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);border-color:#dbe4ef;}
.control-btn.board-action{padding:4px 8px;font-size:12px;opacity:.82;}
#deleteBoardBtn{border-color:#fecaca;color:#b91c1c;background:linear-gradient(180deg,#fff 0%,#fff5f5 100%);} #deleteBoardBtn .btn-icon{color:#b91c1c;}
.control-btn.primary-action.done-state{background:linear-gradient(180deg,#ffffff 0%,#ecfdf3 100%);border-color:#86efac;color:#166534;}
.control-btn.armed{border-color:#f59e0b;background:linear-gradient(180deg,#fff7ed 0%,#ffedd5 100%);color:#9a3412;}
#redoBtn{display:none;}
.db-freshness{font-size:12px;color:#64748b;background:#f8fafc;border:1px solid #e2e8f0;border-radius:999px;padding:4px 8px;align-self:flex-start;}
.search-input{flex:1 1 220px;min-width:180px;border:1px solid #dbe4ef;border-radius:10px;padding:8px 10px;background:#fff;color:#334155;font-size:16px;}
.refresh-btn{flex:0 0 auto;border:1px solid #dbe4ef;background:#fff;border-radius:10px;padding:7px 10px;min-height:44px;color:#334155;font-size:13px;white-space:nowrap;}
.control-btn.saving{opacity:.65;pointer-events:none;}
.control-btn:disabled,.refresh-btn:disabled{opacity:.55;cursor:not-allowed;}
.btn-icon{width:18px;height:18px;border-radius:6px;background:linear-gradient(180deg,#f8fbff 0%,#e8eff8 100%);border:1px solid #d6dfeb;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#475569;box-shadow:inset 0 1px 0 rgba(255,255,255,.9);}
.board-wrapper{flex:1;overflow-x:auto;display:flex;scroll-snap-type:x mandatory;scroll-behavior:smooth;}
.board{min-width:100%;scroll-snap-align:start;}
.board-title{padding:12px 14px;font-weight:700;color:#334155;}
table{width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid #e2e8f0;background:#fff;}
thead{background:#f5f8fc;}
th,td{padding:12px 10px;font-size:16px;border-bottom:1px solid #e5ebf3;border-right:1px solid #e5ebf3;text-align:center;vertical-align:middle;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
th:last-child,td:last-child{border-right:none;}
tbody td{height:52px;}
tbody tr:nth-child(even){background:#f8fbff;}
td[tabindex="0"]:focus-visible,.board-dot:focus-visible,.zone-btn:focus-visible,.control-btn:focus-visible,.refresh-btn:focus-visible{outline:3px solid #2563eb;outline-offset:2px;}
input.inline-edit{width:100%;border:none;outline:none;background:transparent;font-size:16px;text-align:center;line-height:1.25;}
td.editing-cell{position:relative;background:#fffef2 !important;box-shadow:inset 0 0 0 3px #93c5fd;z-index:1;}
td.selected-slot{background:#eff6ff !important;box-shadow:inset 0 0 0 2px #60a5fa;}
.cell-preview{position:fixed;z-index:9999;max-width:240px;background:#23272f;color:#fff;padding:8px 10px;border-radius:8px;font-size:14px;line-height:1.25;box-shadow:0 6px 16px rgba(0,0,0,.25);display:none;pointer-events:none;word-break:break-word;}
.board-dots{display:inline-flex;gap:4px;color:#64748b;}
.board-dot{width:44px;height:44px;border:0;background:transparent;color:#94a3b8;font-size:18px;border-radius:999px;cursor:pointer;}
.board-dot.active{color:#2563eb;font-size:21px;}
@media (max-width: 520px){
  .zone-tabs{gap:6px;padding:6px;}
  .zone-btn{font-size:13px;padding:6px 9px;gap:4px;}
  .zone-btn .btn-icon{width:14px;height:14px;font-size:9px;}
  .search-input{min-width:140px;}
}


.editor-nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:12000;display:none;gap:8px;justify-content:flex-end;padding:8px;background:rgba(255,255,255,.95);border:1px solid #dbe4ef;border-radius:12px;box-shadow:0 8px 22px rgba(15,23,42,.15);backdrop-filter:blur(6px);}
.editor-nav button{border:1px solid #cfd8e6;background:#fff;border-radius:10px;padding:7px 12px;font-weight:700;color:#334155;min-width:44px;min-height:44px;}
.editor-nav button.done{border-color:#86efac;color:#166534;background:#f0fdf4;}
</style>
</head>
<body>

<div class="app">
<div class="top-bar">
  <div class="zone-tabs" role="tablist" aria-label="재고 구역">
    <button class="zone-btn active" data-zone="1" role="tab" aria-selected="true"><span class="btn-icon">①</span>1구역</button>
    <button class="zone-btn" data-zone="2" role="tab" aria-selected="false"><span class="btn-icon">②</span>2구역</button>
    <button class="zone-btn" data-zone="3" role="tab" aria-selected="false"><span class="btn-icon">③</span>3구역</button>
    <button class="zone-btn" data-zone="4" role="tab" aria-selected="false"><span class="btn-icon">④</span>4구역</button>
    <button class="zone-btn" data-zone="5" role="tab" aria-selected="false"><span class="btn-icon">DB</span>DB 비교</button>
  </div>
  <div class="control-row">
    <button id="addBoardBtn" class="control-btn board-action edit-only non-db-only" style="display:none;"><span class="btn-icon">＋</span>현황판 추가</button>
    <button id="deleteBoardBtn" class="control-btn board-action edit-only non-db-only" style="display:none;"><span class="btn-icon">－</span>현황판 삭제</button>
    <button id="clearBtn" class="control-btn clip-action edit-only non-db-only" style="display:none;" title="품목삭제 모드"><span class="btn-icon">⌫</span>품목삭제</button>
    <button id="undoBtn" class="control-btn clip-action edit-only non-db-only" style="display:none;" title="마지막 삭제/잘라내기 되돌리기"><span class="btn-icon">↶</span>되돌리기</button>
    <button id="redoBtn" class="control-btn clip-action edit-only non-db-only" style="display:none;" title="되돌리기 취소"><span class="btn-icon">↷</span>다시실행</button>
    <button id="cutBtn" class="control-btn clip-action edit-only non-db-only" style="display:none;"><span class="btn-icon">✂</span>잘라내기</button>
    <button id="pasteBtn" class="control-btn clip-action edit-only non-db-only" style="display:none;"><span class="btn-icon">📋</span>붙여넣기</button>
    <button id="copyBtn" class="control-btn clip-action edit-only db-only" style="display:none;"><span class="btn-icon">⧉</span>복사</button>
    <button id="installBtn" class="control-btn" style="display:none;"><span class="btn-icon">⬇</span>앱 설치</button>
    <input id="searchInput" class="search-input" type="text" placeholder="코드/품목 검색" />
    <button id="refreshDbBtn" class="refresh-btn" type="button" style="display:none;">DB 새로고침</button>
    <button id="editBtn" class="control-btn primary-action"><span class="btn-icon">✎</span>편집</button>
  </div>
  <div id="dbFreshness" class="db-freshness" style="display:none;">DB 갱신시각: -</div>
</div>

<div id="statusBar" role="status" aria-live="polite" aria-atomic="true" style="display:none;padding:10px 12px;font-size:14px;"></div>
<div id="boardWrapper" class="board-wrapper"></div>
<div id="boardDotsWrap" style="padding:8px 12px 12px;text-align:center;background:#f7f9fc;">
  <div id="boardDots" class="board-dots" role="navigation" aria-label="현황판 이동"></div>
</div>
<div id="cellPreview" class="cell-preview"></div>
<div id="editorNav" class="editor-nav" aria-hidden="true">
  <button id="editorPrevBtn" type="button" aria-label="이전 셀">&lt;</button>
  <button id="editorNextBtn" type="button" aria-label="다음 셀">&gt;</button>
  <button id="editorDoneBtn" type="button" class="done" aria-label="완료">✓</button>
</div>
</div>

<script src="core.js?v=20260714a"></script>
<script>
if(!window.GoodCore){
  const status=document.getElementById("statusBar");
  if(status){
    status.style.display="block";
    status.style.background="#fee2e2";
    status.style.color="#991b1b";
    status.textContent="필수 파일(core.js)을 불러오지 못했습니다. 정적 파일을 함께 배포한 뒤 새로고침하세요.";
  }
  document.querySelectorAll("button,input").forEach((element)=>{ element.disabled=true; });
  throw new Error("GOOD_CORE_NOT_LOADED");
}
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbzk9F62WzEKwR_GaIK8LQOi1q_4ic5ZUFv0voFaJ-g9BlNzNwtubJir0DbWkxYSRqQo/exec";
const slotsPerBoard=12;
let currentZone=1;
let currentBoardIndex=0;
let editMode=false;
let dirtyMap={};
let dbZoneLoadError="";
let selectedSlot=null;
let clipboardData=null;
let pendingLogs=[];
let deferredInstallPrompt=null;
let dbZoneLoaded=false;
let dbZoneLoading=false;
let dbZoneLoadingPromise=null;
let deleteModeActive=false;
let undoStack=[];
let redoStack=[];
let activeEditor=null;
let editorCommitQueue=Promise.resolve();
let dbLastUpdatedAt="";
let searchKeyword="";
let isSaving=false;
let manualRefreshInFlight=false;
let pullRefreshActive=false;
let pullRefreshTriggered=false;
let pullRefreshStartY=0;
let boardMutationInFlight=false;
let offlineSnapshotMode=false;
let pendingBulkRequest=null;
let pendingDeleteRequest=null;

const DATA_SNAPSHOT_KEY="inventory-readonly-snapshot-v1";
const API_TIMEOUT_MS=15000;

const data={};
for(let z=1;z<=5;z++) data[z]=[createBoard()];

function createBoard(){
  return Array.from({length:slotsPerBoard},()=>({code:"",name:"",spec:"",qty:""}));
}
function toNumber(value){ const parsed=GoodCore.parseQuantity(value); return parsed.ok?parsed.value:0; }
const normalizeCode=GoodCore.normalizeCode;
function ensureBoardIn(target,zone,boardIndex){ while(target[zone].length<=boardIndex) target[zone].push(createBoard()); }
function ensureBoard(zone,boardIndex){ ensureBoardIn(data,zone,boardIndex); }

async function fetchWithTimeout(url,options={},timeoutMs=API_TIMEOUT_MS){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{
    const res=await fetch(url,{...options,signal:controller.signal});
    if(!res.ok) throw new Error(`HTTP_${res.status}`);
    return res;
  }finally{
    clearTimeout(timer);
  }
}

function saveReadonlySnapshot(){
  try{
    const zones={};
    for(let z=1;z<=4;z++) zones[z]=data[z];
    localStorage.setItem(DATA_SNAPSHOT_KEY,JSON.stringify({savedAt:new Date().toISOString(),zones}));
  }catch(err){ console.warn("로컬 스냅샷 저장 실패:",err); }
}

function restoreReadonlySnapshot(){
  try{
    const parsed=JSON.parse(localStorage.getItem(DATA_SNAPSHOT_KEY)||"null");
    if(!parsed || !parsed.zones) return false;
    const restored={};
    for(let z=1;z<=4;z++){
      const sourceBoards=parsed.zones[z];
      if(!Array.isArray(sourceBoards) || !sourceBoards.length) return false;
      restored[z]=sourceBoards.map((sourceBoard)=>{
        if(!Array.isArray(sourceBoard)) throw new Error("INVALID_SNAPSHOT_BOARD");
        return Array.from({length:slotsPerBoard},(_,index)=>{
          const row=sourceBoard[index];
          if(row==null) return {code:"",name:"",spec:"",qty:""};
          if(typeof row!=="object" || Array.isArray(row)) throw new Error("INVALID_SNAPSHOT_ROW");
          return {
            code:String(row.code??""),
            name:String(row.name??""),
            spec:String(row.spec??""),
            qty:row.qty??""
          };
        });
      });
    }
    for(let z=1;z<=4;z++) data[z]=restored[z];
    offlineSnapshotMode=true;
    render();
    const stamp=parsed.savedAt?new Date(parsed.savedAt).toLocaleString("ko-KR"):"";
    setStatus(`서버 연결 실패로 마지막 저장 화면${stamp?` (${stamp})`:""}을 읽기 전용으로 표시합니다. 새로고침 후 편집하세요.`,"warn");
    return true;
  }catch(err){ console.warn("로컬 스냅샷 복원 실패:",err); return false; }
}


function updateDbFreshnessLabel(){
  const el=document.getElementById("dbFreshness");
  if(!el) return;
  if(currentZone!==5 || !dbLastUpdatedAt){
    el.style.display="none";
    el.textContent="DB 갱신시각: -";
    return;
  }
  el.style.display="inline-block";
  el.textContent=`DB 갱신시각: ${dbLastUpdatedAt}`;
}

function syncTopBarLayout(){
  const controlRow=document.querySelector(".control-row");
  if(controlRow) controlRow.classList.toggle("compact", !editMode);

  const searchInput=document.getElementById("searchInput");
  if(searchInput) searchInput.style.display=editMode?"none":"inline-block";
}

function syncDbToolsVisibility(){
  const refreshBtn=document.getElementById("refreshDbBtn");
  if(refreshBtn) refreshBtn.style.display=(!editMode && currentZone===5)?"inline-block":"none";
  updateDbFreshnessLabel();
}

async function apiPost(payload,{silent=false}={}){
  try{
    const res=await fetchWithTimeout(SCRIPT_URL,{method:"POST",body:JSON.stringify(payload)});
    return await res.text();
  }catch(err){
    if(!silent) setStatus("네트워크 오류가 발생했습니다. 잠시 후 다시 시도하세요.","error");
    void fetchWithTimeout(
      SCRIPT_URL,
      {method:"POST",body:JSON.stringify({action:"logClientError",area:payload&&payload.action||"unknown",message:err&&err.message||String(err),detail:JSON.stringify(payload||{}),ua:navigator.userAgent})},
      3000
    ).catch(()=>{});
    throw err;
  }
}

function collectBoardInventory(){
  const byCode={};
  for(let zone=1;zone<=4;zone++){
    data[zone].forEach(board=>{
      board.forEach(row=>{
        const code=normalizeCode(row.code);
        if(!code) return;
        const qty=toNumber(row.qty);
        if(qty<=0) return;
        const name=String(row.name||"").trim();
        const spec=String(row.spec||"").trim();
        const displayName=[name,spec].filter(Boolean).join(' ').trim();

        if(!byCode[code]) byCode[code]={code,name:displayName,qty:0};
        byCode[code].qty+=qty;
        if(!byCode[code].name && displayName) byCode[code].name=displayName;
      });
    });
  }


  return byCode;
}

function setStatus(message,type="info"){
  const bar=document.getElementById("statusBar");
  if(!message){ bar.style.display="none"; bar.textContent=""; return; }
  const palette={info:["#e9f0f8","#2f5fa7"],warn:["#fff2cc","#8a6d1f"],error:["#fbe4e6","#9f2d35"],ok:["#e8f5e9","#2e7d32"]};
  const p=palette[type]||palette.info;
  bar.style.display="block"; bar.style.background=p[0]; bar.style.color=p[1]; bar.textContent=message;
}

function hideCellPreview(){
  const el=document.getElementById("cellPreview");
  if(!el) return;
  el.style.display="none";
  el.textContent="";
}

function showCellPreview(text,cellEl){
  if(!text) return;
  const el=document.getElementById("cellPreview");
  if(!el) return;
  el.textContent=String(text);
  el.style.display="block";

  const rect=cellEl.getBoundingClientRect();
  const margin=8;
  const top=Math.max(margin, rect.top - el.offsetHeight - 10);
  let left=rect.left + (rect.width/2) - (el.offsetWidth/2);
  left=Math.max(margin, Math.min(left, window.innerWidth - el.offsetWidth - margin));
  el.style.top=`${top}px`;
  el.style.left=`${left}px`;
}

function updateBoardIndicator(){
  const total=data[currentZone].length;
  if(currentBoardIndex>total-1) currentBoardIndex=Math.max(0,total-1);
  const el=document.getElementById("boardDots");
  el.innerHTML="";
  for(let i=0;i<total;i++){
    const btn=document.createElement("button");
    btn.type="button";
    btn.className=`board-dot${i===currentBoardIndex?" active":""}`;
    btn.textContent=i===currentBoardIndex?"●":"○";
    btn.setAttribute("aria-label",`현황판 ${i+1}로 이동`);
    btn.dataset.boardIndex=String(i);
    if(i===currentBoardIndex) btn.setAttribute("aria-current","page");
    el.appendChild(btn);
  }
  el.dataset.total=String(total);
}

function syncEditControls(){
  document.querySelectorAll(".edit-only").forEach(el=>{
    el.style.display=editMode?"inline-block":"none";
  });

  document.querySelectorAll(".non-db-only").forEach(el=>{
    if(!editMode || currentZone===5){ el.style.display="none"; return; }
    el.style.display="inline-block";
  });

  document.querySelectorAll(".db-only").forEach(el=>{
    if(!editMode || currentZone!==5){ el.style.display="none"; return; }
    el.style.display="inline-block";
  });

  const editBtn=document.getElementById("editBtn");
  if(editBtn){
    editBtn.disabled=offlineSnapshotMode || isSaving;
    editBtn.title=offlineSnapshotMode?"오프라인 스냅샷은 읽기 전용입니다.":"";
    editBtn.classList.toggle("done-state",editMode);
    if(!isSaving) editBtn.innerHTML=editMode?'<span class="btn-icon">✓</span>완료':'<span class="btn-icon">✎</span>편집';
  }
}

function render(){
  const wrapper=document.getElementById("boardWrapper");
  wrapper.innerHTML="";
  selectedSlot=null;
  hideCellPreview();
  if(!editMode || currentZone===5) setEditorNavVisible(false);

  const visibleFields=currentZone===5?["code","name","dbQty","boardQty","qty"]:["code","name","spec","qty"];

  data[currentZone].forEach((board,boardIndex)=>{
    const boardDiv=document.createElement("div");
    boardDiv.className="board";
    boardDiv.dataset.boardIndex=String(boardIndex);

    const title=document.createElement("div");
    title.className="board-title";
    title.textContent=currentZone===5?`DB 비교 ${boardIndex+1}`:`현황판 ${boardIndex+1}`;

    const table=document.createElement("table");
    const columns=currentZone===5?['코드','품명','DB 재고','현황판 재고','차이(DB-현황판)']:['코드','품목','규격','재고'];
    table.innerHTML=`<thead><tr>${columns.map(c=>`<th scope="col">${c}</th>`).join('')}</tr></thead><tbody></tbody>`;
    const tbody=table.querySelector("tbody");

    board.forEach((row,rowIndex)=>{
      if(searchKeyword){
        const haystack=visibleFields.map(f=>String(row[f]||"")).join(" ").toLowerCase();
        if(!haystack.includes(searchKeyword)) return;
      }
      const tr=document.createElement("tr");
      const fields=currentZone===5?["code","name","dbQty","boardQty","qty"]:["code","name","spec","qty"];
      fields.forEach((field,fieldIndex)=>{
        const td=document.createElement("td");
        td.textContent=row[field]??"";
        td.title=String(row[field]??"");
        td.tabIndex=0;
        td.setAttribute("aria-label",`${columns[fieldIndex]}: ${String(row[field]??"비어 있음")}`);
        if(field==="qty"){ td.style.fontWeight="700"; td.style.fontSize="18px"; }
        if(currentZone===5 && field==="qty") {
          if(row.mismatchType==="dbOnly" || row.mismatchType==="slotOver") td.style.color="#c62828";
          else if(row.mismatchType==="boardOnly") td.style.color="#1565c0";
          else td.style.color="#334155";
        }
        td.onclick=(e)=>handleSlotTap(e,td,boardIndex,rowIndex,field);
        td.onkeydown=(e)=>{
          if(e.key!=="Enter" && e.key!==" ") return;
          e.preventDefault();
          if(e.key==="Enter" && editMode && currentZone!==5 && !deleteModeActive) editCell(td,boardIndex,rowIndex,field);
          else handleSlotTap(e,td,boardIndex,rowIndex,field);
        };
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    boardDiv.appendChild(title);
    boardDiv.appendChild(table);
    wrapper.appendChild(boardDiv);
  });

  updateBoardIndicator();
  syncEditControls();
  syncTopBarLayout();
  syncDbToolsVisibility();
  requestAnimationFrame(()=>goToBoard(currentBoardIndex,false));
}

function goToBoard(index,smooth=true){
  const wrapper=document.getElementById("boardWrapper");
  const total=data[currentZone].length;
  currentBoardIndex=Math.max(0,Math.min(index,total-1));
  const left=wrapper.clientWidth*currentBoardIndex;
  wrapper.scrollTo({left,behavior:smooth?"smooth":"auto"});
  updateBoardIndicator();
}

async function loadData({silent=false,rerender=true}={}){
  try{
    const nextData={};
    for(let z=1;z<=4;z++) nextData[z]=[createBoard()];
    const res=await fetchWithTimeout(SCRIPT_URL);
    const rows=await res.json();
    if(!Array.isArray(rows)) throw new Error("응답 형식 오류");

    rows.forEach(row=>{
      const z=Number(row.zone); const b=Number(row.board)-1; const s=Number(row.slot_no)-1;
      if(!Number.isInteger(z) || z<1 || z>4 || !Number.isInteger(b) || b<0 || !Number.isInteger(s) || s<0 || s>=slotsPerBoard) return;
      ensureBoardIn(nextData,z,b);
      nextData[z][b][s]={code:row.code||"",name:row.name||"",spec:row.spec||"",qty:row.qty??""};
    });

    for(let z=1;z<=4;z++) data[z]=nextData[z];

    dbZoneLoaded=false;
    dbLastUpdatedAt="";
    offlineSnapshotMode=false;
    pendingDeleteRequest=null;
    saveReadonlySnapshot();
    updateDbFreshnessLabel();
    if(rerender) render();
    if(!silent) setStatus("");
    return true;
  }catch(err){
    console.error(err);
    if(!silent){
      if(!restoreReadonlySnapshot()) setStatus("데이터 로드 실패: 웹앱 배포 URL/권한을 확인하세요.","error");
      return false;
    }
    throw err;
  }
}

async function refreshFromServer({forceDb=false,showStatus=true,allowUnsaved=false}={}){
  if(!allowUnsaved && hasUnsavedChanges()){
    if(showStatus) setStatus("저장하지 않은 변경사항이 있어 새로고침하지 않았습니다. 먼저 완료 버튼으로 저장하세요.","warn");
    return false;
  }
  if(manualRefreshInFlight) return false;
  manualRefreshInFlight=true;
  const zoneBefore=currentZone;
  const boardBefore=currentBoardIndex;
  try{
    await loadData({silent:true,rerender:false});
    if(zoneBefore===5){
      await loadDbZoneData(!!forceDb);
    }
    currentZone=zoneBefore;
    render();
    goToBoard(Math.min(boardBefore,Math.max(0,data[currentZone].length-1)),false);
    if(showStatus) setStatus("최신 데이터로 새로고침 완료","ok");
    return true;
  }catch(err){
    console.warn("수동 새로고침 실패:",err);
    if(showStatus) setStatus("새로고침 실패: 네트워크/권한을 확인하세요.","error");
    return false;
  }finally{
    manualRefreshInFlight=false;
  }
}


async function loadDbZoneData(forceRefresh=false){
  if(dbZoneLoading && dbZoneLoadingPromise){
    return dbZoneLoadingPromise;
  }
  dbZoneLoading=true;
  dbZoneLoadingPromise=(async()=>{
    dbZoneLoadError="";
    try{
      const text=await apiPost({action:"getDbDiff",forceRefresh:!!forceRefresh});

      if(text==="NO_ACTION"){
        dbZoneLoadError="DB재고 로드 실패: Apps Script가 구버전입니다. 서버를 재배포하세요.";
        return {ok:false,error:dbZoneLoadError};
      }

      let rows=[];
      try{
        rows=JSON.parse(text);
      }catch(_){
        dbZoneLoadError="DB재고 로드 실패: 서버 응답 형식을 확인하세요.";
        return {ok:false,error:dbZoneLoadError};
      }

      if(!Array.isArray(rows)){
        dbZoneLoadError="DB재고 로드 실패: 배열 응답이 아닙니다.";
        return {ok:false,error:dbZoneLoadError};
      }

      const boardByCode=collectBoardInventory();
      const dbByCode=GoodCore.aggregateByCode(rows);

      const mismatchRows=[];

      Object.keys(dbByCode).forEach(code=>{
        const dbRow=dbByCode[code];
        const boardRow=boardByCode[code];
        const dbQty=toNumber(dbRow.qty);
        const boardQty=boardRow?toNumber(boardRow.qty):0;
        const diffQty=dbQty-boardQty;

        if(!boardRow || diffQty!==0){
          mismatchRows.push({
            code:dbRow.code,
            name:dbRow.name,
            spec:"",
            dbQty:String(dbQty),
            boardQty:String(boardQty),
            qty:String(diffQty),
            mismatchType:diffQty<0?"slotOver":"dbOnly"
          });
        }
      });

      Object.keys(boardByCode).forEach(code=>{
        if(dbByCode[code]) return;
        const row=boardByCode[code];
        const qty=toNumber(row.qty);
        mismatchRows.push({
          code:row.code,
          name:row.name,
          spec:"",
          dbQty:"0",
          boardQty:String(qty),
          qty:String(-qty),
          mismatchType:"slotOver"
        });
      });

      mismatchRows.sort((a,b)=>{
        const rank=(row)=>row.mismatchType==='dbOnly'?0:1;
        const byType=rank(a)-rank(b);
        if(byType!==0) return byType;
        return a.code.localeCompare(b.code,'ko');
      });

      const nextDbData=[createBoard()];
      mismatchRows.forEach((row,idx)=>{
        const b=Math.floor(idx/slotsPerBoard);
        const s=idx%slotsPerBoard;
        ensureBoardIn({5:nextDbData},5,b);
        nextDbData[b][s]=row;
      });

      data[5]=nextDbData;
      dbZoneLoaded=true;
      dbLastUpdatedAt=new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
      updateDbFreshnessLabel();

      return {ok:true,mismatchCount:mismatchRows.length};
    }catch(err){
      console.warn("DB 구역 로드 실패:",err);
      dbZoneLoadError="DB재고 로드 실패: 네트워크/권한을 확인하세요.";
      dbZoneLoaded=false;
      return {ok:false,error:dbZoneLoadError};
    }finally{
      dbZoneLoading=false;
    }
  })();
  return dbZoneLoadingPromise;
}

function markDirty(zone,boardIndex,rowIndex){
  dirtyMap[`${zone}-${boardIndex}-${rowIndex}`]=true;
}

function pushUndoSnapshot(zone,boardIndex,rowIndex,row){
  redoStack=[];
  undoStack.push({
    zone,
    boardIndex,
    rowIndex,
    row:{code:row.code||"",name:row.name||"",spec:row.spec||"",qty:String(row.qty??"")}
  });
  if(undoStack.length>50) undoStack.shift();
}

function clearRow(zone,boardIndex,rowIndex){
  data[zone][boardIndex][rowIndex]={code:"",name:"",spec:"",qty:""};
  markDirty(zone,boardIndex,rowIndex);
}

function performDeleteWithConfirm(zone,boardIndex,rowIndex){
  const row=data[zone][boardIndex][rowIndex];
  const code=row.code||"";
  const name=[row.name||"",row.spec||""].filter(Boolean).join(" ").trim();
  const qty=String(row.qty||"");
  if(!code && !name && !qty){
    alert("이미 비어있는 슬롯입니다.");
    return false;
  }

  const ok=confirm(`[품목코드:${code||"-"} / 품목명:${name||"-"} / 재고:${qty||"0"}] 항목을 지우시겠습니까?`);
  if(!ok) return false;

  pushUndoSnapshot(zone,boardIndex,rowIndex,row);
  clearRow(zone,boardIndex,rowIndex);
  setStatus("품목 삭제 완료 (되돌리기 가능)","ok");
  return true;
}

function undoDelete(){
  if(!undoStack.length){
    alert("되돌릴 삭제 기록이 없습니다.");
    return;
  }
  const last=undoStack.pop();
  const current=data[last.zone][last.boardIndex][last.rowIndex];
  redoStack.push({zone:last.zone,boardIndex:last.boardIndex,rowIndex:last.rowIndex,row:{...current}});
  ensureBoard(last.zone,last.boardIndex);
  data[last.zone][last.boardIndex][last.rowIndex]={...last.row};
  markDirty(last.zone,last.boardIndex,last.rowIndex);
  setStatus("마지막 삭제를 되돌렸습니다.","ok");
  render();
}

function redoDelete(){
  if(!redoStack.length){
    alert("다시실행할 기록이 없습니다.");
    return;
  }
  const last=redoStack.pop();
  const current=data[last.zone][last.boardIndex][last.rowIndex];
  undoStack.push({zone:last.zone,boardIndex:last.boardIndex,rowIndex:last.rowIndex,row:{...current}});
  ensureBoard(last.zone,last.boardIndex);
  data[last.zone][last.boardIndex][last.rowIndex]={...last.row};
  markDirty(last.zone,last.boardIndex,last.rowIndex);
  setStatus("되돌리기 취소를 적용했습니다.","ok");
  render();
}

async function handleSlotTap(event,cell,boardIndex,rowIndex,field){
  if(event) event.stopPropagation();
  const same=selectedSlot &&
    selectedSlot.zone===currentZone &&
    selectedSlot.boardIndex===boardIndex &&
    selectedSlot.rowIndex===rowIndex &&
    selectedSlot.field===field;

  if(selectedSlot && selectedSlot.cellEl && selectedSlot.cellEl!==cell){
    selectedSlot.cellEl.classList.remove("selected-slot");
  }

  if(!editMode){
    selectedSlot=null;
    hideCellPreview();
    setEditorNavVisible(false);
    const row=data[currentZone][boardIndex][rowIndex];
    if(field==="name" || field==="spec") showCellPreview(row[field],cell);
    return;
  }

  cell.classList.add("selected-slot");
  selectedSlot={zone:currentZone,boardIndex,rowIndex,field,cellEl:cell};

  if(editMode && currentZone!==5 && deleteModeActive){
    const deleted=performDeleteWithConfirm(currentZone,boardIndex,rowIndex);
    if(deleted) render();
    return;
  }

  if(editMode && currentZone!==5 && same){
    await editCell(cell,boardIndex,rowIndex,field);
  }
}

function copySlot(){
  if(!selectedSlot){ alert("먼저 셀을 선택하세요."); return; }
  const row=data[selectedSlot.zone][selectedSlot.boardIndex][selectedSlot.rowIndex];

  if(selectedSlot.zone===5){
    clipboardData={type:"db",code:row.code||"",name:row.name||"",qty:String(toNumber(row.dbQty))};
    setStatus("DB 데이터 복사 완료 (코드/품명/DB 재고)","ok");
    return;
  }

  clipboardData={type:"full",row:{code:row.code||"",name:row.name||"",spec:row.spec||"",qty:String(row.qty??"")}};
  setStatus("슬롯 복사 완료","ok");
}

function cutSlot(){
  if(!selectedSlot){ alert("먼저 셀을 선택하세요."); return; }
  if(selectedSlot.zone===5){ alert("DB구역에서는 잘라내기를 사용할 수 없습니다."); return; }

  const row=data[selectedSlot.zone][selectedSlot.boardIndex][selectedSlot.rowIndex];
  clipboardData={type:"full",row:{code:row.code||"",name:row.name||"",spec:row.spec||"",qty:String(row.qty??"")}};

  pushUndoSnapshot(selectedSlot.zone,selectedSlot.boardIndex,selectedSlot.rowIndex,row);
  clearRow(selectedSlot.zone,selectedSlot.boardIndex,selectedSlot.rowIndex);
  setStatus("슬롯 잘라내기 완료 (되돌리기 가능)","ok");
  render();
}

function pasteSlot(){
  if(!selectedSlot){ alert("붙여넣을 대상 셀을 먼저 선택하세요."); return; }
  if(selectedSlot.zone===5){ alert("DB구역에는 붙여넣을 수 없습니다."); return; }
  if(!clipboardData){ alert("클립보드가 비어있습니다. 먼저 복사/잘라내기를 하세요."); return; }

  const target=data[selectedSlot.zone][selectedSlot.boardIndex][selectedSlot.rowIndex];
  const candidate=clipboardData.type==="db"
    ? {code:clipboardData.code||"",name:clipboardData.name||"",spec:"",qty:String(clipboardData.qty??"")}
    : {code:clipboardData.row.code||"",name:clipboardData.row.name||"",spec:clipboardData.row.spec||"",qty:String(clipboardData.row.qty??"")};
  const validation=GoodCore.validateInventoryRow(candidate);
  if(!validation.ok){
    alert(validation.error);
    setStatus(`붙여넣기 취소: ${validation.error}`,"error");
    return;
  }
  const hasExisting=[target.code,target.name,target.spec,target.qty].some(value=>String(value??"").trim()!=="");
  if(hasExisting && !confirm("선택한 칸의 기존 내용을 덮어쓸까요?")) return;
  pushUndoSnapshot(selectedSlot.zone,selectedSlot.boardIndex,selectedSlot.rowIndex,target);
  target.code=candidate.code;
  target.name=candidate.name;
  target.spec=candidate.spec;
  target.qty=validation.text;

  markDirty(selectedSlot.zone,selectedSlot.boardIndex,selectedSlot.rowIndex);
  setStatus("붙여넣기 완료","ok");
  render();
}

function setDeleteMode(active){
  deleteModeActive=!!active;
  const btn=document.getElementById("clearBtn");
  if(btn) btn.classList.toggle("armed",deleteModeActive);
}

function clearSlotIfZero(){
  if(currentZone===5){ alert("DB구역에서는 품목삭제를 사용할 수 없습니다."); return; }
  setDeleteMode(!deleteModeActive);
  if(deleteModeActive) setStatus("품목삭제 모드: 삭제할 슬롯을 선택하세요.","warn");
  else setStatus("품목삭제 모드 해제","info");
}


function setEditorNavVisible(visible){
  const nav=document.getElementById("editorNav");
  if(!nav) return;
  nav.style.display=visible?"flex":"none";
  nav.setAttribute("aria-hidden", visible?"false":"true");
}

async function finishActiveEditor(){
  if(activeEditor && activeEditor.committing) return activeEditor.commitPromise;
  editorCommitQueue=editorCommitQueue.then(async ()=>{
    const snapshot=activeEditor;
    if(!snapshot) return true;
    if(snapshot.committing) return snapshot.commitPromise;

    snapshot.committing=true;
    snapshot.commitPromise=(async ()=>{
      const {zone,boardIndex,rowIndex,field,oldValue,input,cell}=snapshot;
      const ok=await processChange(zone,boardIndex,rowIndex,field,oldValue,input.value.trim());
      if(!ok){
        snapshot.committing=false;
        snapshot.commitPromise=null;
        input.setAttribute("aria-invalid","true");
        setTimeout(()=>{ try{ input.focus(); input.select(); }catch(_){} },0);
        return false;
      }
      cell.classList.remove("editing-cell");
      cell.textContent=data[zone][boardIndex][rowIndex][field];
      if(activeEditor===snapshot) activeEditor=null;
      setEditorNavVisible(false);
      return true;
    })();

    return snapshot.commitPromise;
  });

  return editorCommitQueue;
}

function getFieldListForZone(zone){
  return zone===5?["code","name","dbQty","boardQty","qty"]:["code","name","spec","qty"];
}

function getCellByLocation(boardIndex,rowIndex,field){
  const fields=getFieldListForZone(currentZone);
  const fieldIdx=fields.indexOf(field);
  if(fieldIdx===-1) return null;
  const boardEl=document.querySelector(`.board[data-board-index="${boardIndex}"]`);
  if(!boardEl) return null;
  const rowEl=boardEl.querySelectorAll("tbody tr")[rowIndex];
  if(!rowEl) return null;
  return rowEl.querySelectorAll("td")[fieldIdx] || null;
}

async function moveEditor(delta){
  if(!activeEditor) return;
  const fields=getFieldListForZone(currentZone);
  let {boardIndex,rowIndex,field}=activeEditor;
  let idx=fields.indexOf(field);
  const committed=await finishActiveEditor();
  if(!committed) return;

  idx+=delta;
  while(idx<0){
    if(rowIndex===0) { idx=0; break; }
    rowIndex-=1;
    idx=fields.length-1;
  }
  while(idx>=fields.length){
    if(rowIndex>=slotsPerBoard-1) { idx=fields.length-1; break; }
    rowIndex+=1;
    idx=0;
  }

  const nextField=fields[idx];
  const nextCell=getCellByLocation(boardIndex,rowIndex,nextField);
  if(nextCell) await editCell(nextCell,boardIndex,rowIndex,nextField);
}

async function editCell(cell,boardIndex,rowIndex,field){
  if(cell.querySelector("input")) return;
  if(activeEditor && activeEditor.cell!==cell){
    const committed=await finishActiveEditor();
    if(!committed) return;
  }

  const oldValue=data[currentZone][boardIndex][rowIndex][field];
  const input=document.createElement("input");
  input.value=oldValue; input.className="inline-edit";
  if(field==="qty"){
    input.inputMode="numeric";
    input.pattern="[0-9]*";
    input.min="0";
    input.step="1";
    input.setAttribute("aria-label","재고 수량");
  }
  cell.classList.add("editing-cell");
  cell.textContent=""; cell.appendChild(input); input.focus();
  activeEditor={zone:currentZone,cell,input,boardIndex,rowIndex,field,oldValue,committing:false};
  input.oninput=()=>input.removeAttribute("aria-invalid");
  setEditorNavVisible(editMode && currentZone!==5);
  try{ cell.scrollIntoView({block:"center",inline:"nearest",behavior:"smooth"}); }catch(_){}

  input.onblur=()=>{ finishActiveEditor(); };
}

async function processChange(zone,boardIndex,rowIndex,field,oldValue,newValue){
  const row=data[zone][boardIndex][rowIndex];
  if(field==="qty"){
    const validation=GoodCore.validateInventoryRow({...row,qty:newValue});
    if(!validation.ok){
      alert(validation.error);
      setStatus(validation.error,"error");
      return false;
    }
    const oldParsed=GoodCore.parseQuantity(oldValue);
    const oldQty=oldParsed.ok?oldParsed.value:0;
    const diff=validation.value-oldQty;
    if(diff!==0){
      pendingLogs.push({
        zone,
        board:boardIndex+1,
        code:row.code,
        type:diff>0?"IN":"OUT",
        qty:Math.abs(diff)
      });
    }
    row[field]=validation.text;
  }else{
    row[field]=newValue;
  }
  const rowValidation=GoodCore.validateInventoryRow(row);
  if(!rowValidation.ok){
    row[field]=oldValue;
    alert(rowValidation.error);
    setStatus(rowValidation.error,"error");
    return false;
  }
  markDirty(zone,boardIndex,rowIndex);
  return true;
}


function setSavingState(saving){
  isSaving=!!saving;
  const editBtn=document.getElementById("editBtn");
  if(!editBtn) return;
  editBtn.classList.toggle("saving",isSaving);
  editBtn.disabled=isSaving || offlineSnapshotMode;
  if(isSaving){
    editBtn.innerHTML='<span class="btn-icon">…</span>저장중';
  }else{
    editBtn.innerHTML=editMode?'<span class="btn-icon">✓</span>완료':'<span class="btn-icon">✎</span>편집';
  }
}

function hasUnsavedChanges(){
  return !!activeEditor || Object.keys(dirtyMap).length>0 || pendingLogs.length>0;
}

function getSaveRequest(items){
  const fingerprint=JSON.stringify({items,logs:pendingLogs});
  if(!pendingBulkRequest || pendingBulkRequest.fingerprint!==fingerprint){
    pendingBulkRequest={fingerprint,requestId:GoodCore.createRequestId()};
  }
  return pendingBulkRequest;
}

async function saveAll(){
  const committed=await finishActiveEditor();
  if(!committed){
    editMode=true;
    syncEditControls();
    return false;
  }
  setSavingState(true);
  try{
    const keys=Object.keys(dirtyMap).sort();
    if(!keys.length && !pendingLogs.length) return true;

    const items=[];
    for(const key of keys){
      const [z,b,s]=key.split("-");
      if(Number(z)===5) continue;
      const row=data[z][b][s];
      items.push({
        zone:Number(z),
        board:Number(b)+1,
        slot_no:Number(s)+1,
        code:row.code,
        name:row.name,
        spec:row.spec,
        qty:row.qty
      });
    }

    for(const item of items){
      const validation=GoodCore.validateInventoryRow(item);
      if(!validation.ok){
        setStatus(`저장하지 못했습니다: ${item.zone}구역 ${item.board}번 현황판 ${item.slot_no}번 칸 — ${validation.error}`,"error");
        editMode=true;
        render();
        return false;
      }
    }

    const request=getSaveRequest(items);
    let text;
    try{
      text=await apiPost({action:"bulkSave",requestId:request.requestId,items,logs:pendingLogs});
    }catch(err){
      console.warn("bulkSave 응답 확인 실패:",err);
      setStatus("저장 결과를 확인하지 못했습니다. 같은 내용으로 다시 저장하면 중복 처리되지 않습니다.","error");
      return false;
    }

    let result=null;
    if(text!=="NO_ACTION"){
      try{ result=JSON.parse(text); }
      catch(err){
        console.warn("bulkSave 응답 파싱 실패:",err,text);
        setStatus("서버 응답을 해석하지 못해 저장 상태를 확정할 수 없습니다. 자동 개별 저장은 실행하지 않았습니다.","error");
        return false;
      }
      if(!result || result.status!=="OK"){
        setStatus(`저장 거부: ${(result&&result.message)||"서버에서 입력값을 확인하세요."}`,"error");
        return false;
      }
    }

    if(text==="NO_ACTION"){
      setStatus("안전한 일괄 저장을 지원하지 않는 서버입니다. Apps Script를 먼저 재배포한 뒤 다시 저장하세요. 변경 내용은 이 화면에 유지됩니다.","error");
      return false;
    }

    dirtyMap={};
    pendingLogs=[];
    pendingBulkRequest=null;
    redoStack=[];
    dbZoneLoaded=false;
    saveReadonlySnapshot();
    const refreshed=await refreshFromServer({forceDb:true,showStatus:false});
    if(refreshed){
      setStatus(`저장 완료 (수정 ${result.updated||0}, 생성 ${result.created||0}, 로그 ${result.logged||0}) · 최신 화면 반영 완료`,"ok");
    }else{
      setStatus("저장은 완료됐지만 최신 화면을 다시 불러오지 못했습니다. 네트워크 연결 후 새로고침하세요.","warn");
    }
    return true;
  }finally{
    setSavingState(false);
    syncEditControls();
  }
}

async function addBoard(){
  if(boardMutationInFlight) return;
  if(hasUnsavedChanges()){
    setStatus("저장하지 않은 변경사항이 있습니다. 먼저 완료 버튼으로 저장한 뒤 현황판을 추가하세요.","warn");
    return;
  }
  boardMutationInFlight=true;
  const addBtn=document.getElementById("addBoardBtn");
  if(addBtn) addBtn.disabled=true;
  try{
  const boardNo=data[currentZone].length+1;
  const text=await apiPost({action:"createBoard",zone:currentZone,board:boardNo});
  if(text!=="BOARD_CREATED"){
    if(text==="NO_ACTION"){
      setStatus("현황판 추가 실패: 서버 배포가 구버전입니다. Apps Script 재배포 후 다시 시도하세요.","error");
      return;
    }
    setStatus(`현황판 추가 실패: ${text}`,"error");
    return;
  }
  ensureBoard(currentZone,boardNo-1);
  saveReadonlySnapshot();
  setStatus(`현황판 ${boardNo} 추가 완료`,"ok");
  render();
  goToBoard(boardNo-1);
  }finally{
    boardMutationInFlight=false;
    if(addBtn) addBtn.disabled=false;
  }
}

async function deleteCurrentBoard(){
  if(boardMutationInFlight) return;
  if(hasUnsavedChanges()){
    setStatus("저장하지 않은 변경사항이 있어 현황판을 삭제하지 않았습니다. 먼저 완료 버튼으로 저장하세요.","warn");
    return;
  }
  if(data[currentZone].length<=1){ alert("현황판은 최소 1개가 필요합니다."); return; }
  const boardNo=currentBoardIndex+1;
  if(!confirm(`${currentZone}구역의 ${boardNo}번 현황판을 삭제할까요?`)) return;
  const expectedFingerprint=GoodCore.boardFingerprint(data[currentZone][currentBoardIndex],slotsPerBoard);
  const deleteFingerprint=`${currentZone}|${boardNo}|${expectedFingerprint}`;
  if(!pendingDeleteRequest || pendingDeleteRequest.fingerprint!==deleteFingerprint){
    pendingDeleteRequest={fingerprint:deleteFingerprint,requestId:GoodCore.createRequestId()};
  }
  boardMutationInFlight=true;
  const btn=document.getElementById("deleteBoardBtn");
  if(btn) btn.disabled=true;
  try{
    const text=await apiPost({
      action:"deleteBoardSafe",
      zone:currentZone,
      board:boardNo,
      requestId:pendingDeleteRequest.requestId,
      expectedFingerprint
    });
    if(text==="NO_ACTION"){
      setStatus("안전한 현황판 삭제를 지원하지 않는 서버입니다. Apps Script 재배포 후 다시 시도하세요.","warn");
      return;
    }
    let result;
    try{ result=JSON.parse(text); }
    catch(_){ setStatus("현황판 삭제 응답 형식이 올바르지 않습니다. 서버를 재배포해 주세요.","error"); return; }
    if(!result || result.status!=="OK"){
      if(result&&result.code==="MIN_BOARD") setStatus("현황판은 구역마다 최소 1개가 필요합니다.","warn");
      else if(result&&result.code==="BOARD_NOT_FOUND") setStatus("다른 사용자가 현황판을 변경했습니다. 새로고침 후 다시 시도하세요.","warn");
      else if(result&&result.code==="STALE_BOARD") setStatus("다른 사용자가 현황판을 변경해 삭제하지 않았습니다. 새로고침 후 다시 확인하세요.","warn");
      else if(result&&result.code==="AMBIGUOUS_DELETE") setStatus("이전 삭제 요청의 처리 상태가 불확실합니다. 새로고침해 현황판을 확인하세요.","warn");
      else setStatus(`현황판 삭제 실패: ${(result&&result.message)||"서버 응답을 확인하세요."}`,"error");
      if(result&&["BOARD_NOT_FOUND","STALE_BOARD"].includes(result.code)) pendingDeleteRequest=null;
      return;
    }
    pendingDeleteRequest=null;
    undoStack=[];
    redoStack=[];
    selectedSlot=null;
    activeEditor=null;
    const refreshed=await refreshFromServer({forceDb:false,showStatus:false});
    if(!refreshed){
      data[currentZone].splice(currentBoardIndex,1);
      currentBoardIndex=Math.min(currentBoardIndex,data[currentZone].length-1);
      saveReadonlySnapshot();
      render();
      setStatus(`현황판 ${boardNo} 삭제는 완료됐지만 최신 목록을 불러오지 못했습니다.`,"warn");
    }else{
      setStatus(`현황판 ${boardNo} 삭제 완료`,"ok");
    }
  }finally{
    boardMutationInFlight=false;
    if(btn) btn.disabled=false;
  }
}

document.getElementById("editBtn").onclick=async ()=>{
  if(isSaving) return;
  editMode=!editMode;
  if(editMode && searchKeyword){
    searchKeyword="";
    document.getElementById("searchInput").value="";
    setStatus("");
  }
  hideCellPreview();
  if(!editMode || currentZone===5) setEditorNavVisible(false);
  const editBtn=document.getElementById("editBtn");
  editBtn.innerHTML=editMode?'<span class="btn-icon">✓</span>완료':'<span class="btn-icon">✎</span>편집';
  editBtn.classList.toggle("done-state",editMode);
  if(!editMode){
    setDeleteMode(false);
    setEditorNavVisible(false);
    const saved=await saveAll();
    if(saved===false){
      editMode=true;
      editBtn.innerHTML='<span class="btn-icon">✓</span>완료';
      editBtn.classList.add("done-state");
      syncEditControls();
      syncTopBarLayout();
      return;
    }
  }
  render();
};

document.getElementById("addBoardBtn").onclick=addBoard;
document.getElementById("deleteBoardBtn").onclick=deleteCurrentBoard;
document.getElementById("copyBtn").onclick=copySlot;
document.getElementById("cutBtn").onclick=cutSlot;
document.getElementById("pasteBtn").onclick=pasteSlot;
document.getElementById("clearBtn").onclick=clearSlotIfZero;
document.getElementById("undoBtn").onclick=undoDelete;
document.getElementById("redoBtn").onclick=redoDelete;
const editorPrevBtn=document.getElementById("editorPrevBtn");
const editorNextBtn=document.getElementById("editorNextBtn");
const editorDoneBtn=document.getElementById("editorDoneBtn");

[editorPrevBtn,editorNextBtn].forEach(btn=>{
  btn.onmousedown=(e)=>e.preventDefault();
});

editorPrevBtn.onclick=()=>moveEditor(-1);
editorNextBtn.onclick=()=>moveEditor(1);
editorDoneBtn.onclick=()=>finishActiveEditor();
document.getElementById("refreshDbBtn").onclick=async ()=>{
  setStatus("DB재고 강제 새로고침 중...","info");
  const result=await loadDbZoneData(true);
  if(result&&result.ok){
    if(result.mismatchCount===0) setStatus("DB재고 비교 결과: DB 시트와 1~4구역 현황판 차이가 없습니다.","ok");
    else setStatus(`DB재고 비교 완료: ${result.mismatchCount}건 차이가 있습니다.`,"warn");
  }else if(dbZoneLoadError){
    setStatus(dbZoneLoadError,"warn");
  }
  if(currentZone===5) render();
};
document.getElementById("boardWrapper").addEventListener("touchstart",(e)=>{
  if(e.touches.length!==1 || editMode || isSaving || manualRefreshInFlight || hasUnsavedChanges()) return;
  if(window.scrollY>0) return;
  pullRefreshActive=true;
  pullRefreshTriggered=false;
  pullRefreshStartY=e.touches[0].clientY;
},{passive:true});

document.getElementById("boardWrapper").addEventListener("touchmove",(e)=>{
  if(!pullRefreshActive || pullRefreshTriggered) return;
  const delta=e.touches[0].clientY-pullRefreshStartY;
  if(delta<90) return;
  pullRefreshTriggered=true;
  setStatus("새로고침 중...","info");
  refreshFromServer({forceDb:currentZone===5,showStatus:true});
},{passive:true});

document.getElementById("boardWrapper").addEventListener("touchend",()=>{
  pullRefreshActive=false;
  pullRefreshTriggered=false;
});

document.getElementById("boardWrapper").addEventListener("touchcancel",()=>{
  pullRefreshActive=false;
  pullRefreshTriggered=false;
});
function findSearchMatches(keyword){
  if(!keyword) return [];
  const fields=currentZone===5?["code","name","dbQty","boardQty","qty"]:["code","name","spec","qty"];
  const matches=[];
  data[currentZone].forEach((board,boardIndex)=>{
    const count=board.reduce((sum,row)=>{
      const haystack=fields.map(field=>String(row[field]??"")).join(" ").toLowerCase();
      return sum+(haystack.includes(keyword)?1:0);
    },0);
    if(count) matches.push({boardIndex,count});
  });
  return matches;
}

document.getElementById("searchInput").addEventListener("input",(e)=>{
  searchKeyword=String(e.target.value||"").trim().toLowerCase();
  const matches=findSearchMatches(searchKeyword);
  if(matches.length) currentBoardIndex=matches[0].boardIndex;
  else currentBoardIndex=0;
  render();
  if(!searchKeyword) setStatus("");
  else if(!matches.length) setStatus("검색 결과가 없습니다.","info");
  else setStatus(`검색 결과 ${matches.reduce((sum,item)=>sum+item.count,0)}건 · ${matches.length}개 현황판`,"info");
});

document.getElementById("boardDots").onclick=(e)=>{
  const btn=e.target.closest(".board-dot");
  if(!btn) return;
  goToBoard(Number(btn.dataset.boardIndex));
};

document.getElementById("boardWrapper").addEventListener("scroll",()=>{
  const wrapper=document.getElementById("boardWrapper");
  const index=Math.round(wrapper.scrollLeft/Math.max(wrapper.clientWidth,1));
  if(index!==currentBoardIndex){ currentBoardIndex=index; updateBoardIndicator(); }
});

document.querySelectorAll(".zone-btn").forEach(btn=>{
  btn.onclick=async ()=>{
    const committed=await finishActiveEditor();
    if(!committed) return;
    document.querySelectorAll(".zone-btn").forEach(b=>{
      b.classList.remove("active");
      b.setAttribute("aria-selected","false");
    });
    btn.classList.add("active");
    btn.setAttribute("aria-selected","true");
    currentZone=Number(btn.dataset.zone);
    const matches=findSearchMatches(searchKeyword);
    currentBoardIndex=matches.length?matches[0].boardIndex:0;
    setEditorNavVisible(false);
    setDeleteMode(false);
    if(currentZone!==5) updateDbFreshnessLabel();

    if(currentZone===5 && !dbZoneLoaded){
      setStatus("DB재고 불러오는 중...","info");
      const result=await loadDbZoneData();
      if(result&&result.ok){
        if(result.mismatchCount===0) setStatus("DB재고 비교 결과: DB 시트와 1~4구역 현황판 차이가 없습니다.","ok");
        else setStatus(`DB재고 비교 완료: ${result.mismatchCount}건 차이가 있습니다.`,"warn");
      }
    }

    render();
    goToBoard(currentBoardIndex,false);
    if(currentZone===5 && dbZoneLoadError) setStatus(dbZoneLoadError,"warn");
  };
});


function setupPwaInstall(){
  const btn=document.getElementById("installBtn");
  if(!btn) return;

  window.addEventListener("beforeinstallprompt",(e)=>{
    e.preventDefault();
    deferredInstallPrompt=e;
    btn.style.display="inline-block";
  });

  btn.onclick=async ()=>{
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    try{ await deferredInstallPrompt.userChoice; }catch(_){ }
    deferredInstallPrompt=null;
    btn.style.display="none";
  };

  window.addEventListener("appinstalled",()=>{
    deferredInstallPrompt=null;
    btn.style.display="none";
    setStatus("앱 설치 완료","ok");
  });
}

function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('service-worker.js').catch((err)=>{
      console.warn('SW 등록 실패:',err);
    });
  });
}

document.addEventListener("click",hideCellPreview);
window.addEventListener("beforeunload",(event)=>{
  if(!hasUnsavedChanges()) return;
  event.preventDefault();
  event.returnValue="";
});
setupPwaInstall();
registerServiceWorker();
loadData();
</script>
