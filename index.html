<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>재고 시스템 최종버전</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{margin:0;background:#e9e3da;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
.app{width:100%;min-height:100vh;background:#f6f1ea;display:flex;flex-direction:column;}
.top-bar{background:#dbe6f3;padding:12px;display:flex;gap:12px;}
.zone-btn{font-size:17px;color:#4a5f82;}
.zone-btn.active{font-weight:bold;color:#2f5fa7;}
.control-btn{margin-left:auto;color:#2f5fa7;}
.board-wrapper{flex:1;overflow-x:auto;display:flex;scroll-snap-type:x mandatory;scroll-behavior:smooth;}
.board{min-width:100%;scroll-snap-align:start;}
table{width:100%;border-collapse:collapse;}
thead{background:#b8c7db;}
th,td{padding:14px;font-size:16px;border-bottom:1px solid #d7dbe2;}
tbody tr:nth-child(even){background:#e9f0f8;}
input.inline-edit{width:100%;border:none;outline:none;background:transparent;font-size:16px;}
.selected{background:rgba(255,220,120,0.18);}
</style>
</head>
<body>

<div class="app">
<div class="top-bar">
  <button class="zone-btn active" data-zone="1">1구역</button>
  <button class="zone-btn" data-zone="2">2구역</button>
  <button class="zone-btn" data-zone="3">3구역</button>
  <button class="zone-btn" data-zone="4">4구역</button>
  <button class="zone-btn" data-zone="5">5구역</button>
  <button id="editBtn" class="control-btn">편집</button>
</div>

<div id="statusBar" style="display:none;padding:10px 12px;font-size:14px;"></div>
<div id="boardWrapper" class="board-wrapper"></div>
</div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbzNqqJkIEhuTGR4FOcrv0UUIfAi2oSt8Qm9vwyczAEfvWOJSQrbv-I5mx7MlQA8wzlE/exec";

const slotsPerBoard=12;
let currentZone=1;
let editMode=false;
let dirtyMap={};

function toNumber(value){
  const num=Number(value);
  return Number.isFinite(num)?num:0;
}


function setStatus(message,type="info"){
  const bar=document.getElementById("statusBar");
  if(!message){
    bar.style.display="none";
    bar.textContent="";
    return;
  }
  const palette={
    info:{bg:"#e9f0f8",fg:"#2f5fa7"},
    warn:{bg:"#fff2cc",fg:"#8a6d1f"},
    error:{bg:"#fbe4e6",fg:"#9f2d35"},
    ok:{bg:"#e8f5e9",fg:"#2e7d32"}
  };
  const p=palette[type]||palette.info;
  bar.style.display="block";
  bar.style.background=p.bg;
  bar.style.color=p.fg;
  bar.textContent=message;
}
const data={};
for(let z=1;z<=5;z++){
  data[z]=[createBoard()];
}

function ensureBoard(zone, boardIndex){
  if(!data[zone]) return;
  while(data[zone].length<=boardIndex){
    data[zone].push(createBoard());
  }
}

function createBoard(){
  const arr=[];
  for(let i=0;i<slotsPerBoard;i++){
    arr.push({code:"",name:"",spec:"",qty:""});
  }
  return arr;
}

async function loadData(){
  try{
    const res=await fetch(SCRIPT_URL);
    const rows=await res.json();

    if(!Array.isArray(rows)){
      throw new Error("응답 형식 오류");
    }

    setStatus("");

    rows.forEach(row=>{
    const z=row.zone;
    const b=row.board-1;
    const s=row.slot_no-1;

    ensureBoard(z,b);

    if(data[z]&&data[z][b]&&data[z][b][s]){
      data[z][b][s]={
        code:row.code||"",
        name:row.name||"",
        spec:row.spec||"",
        qty:row.qty||""
      };
    }
  });

    render();
  }catch(err){
    console.error(err);
    setStatus("데이터 로드 실패: 웹앱 배포 URL/권한을 확인하세요.","error");
  }
}

function render(){
  const wrapper=document.getElementById("boardWrapper");
  wrapper.innerHTML="";

  data[currentZone].forEach((board,boardIndex)=>{
    const boardDiv=document.createElement("div");
    boardDiv.className="board";

    const table=document.createElement("table");
    table.innerHTML=`
      <thead>
        <tr>
          <th>코드</th><th>품목</th><th>규격</th><th>재고</th>
        </tr>
      </thead><tbody></tbody>`;

    const tbody=table.querySelector("tbody");

    board.forEach((row,rowIndex)=>{
      const tr=document.createElement("tr");

      ["code","name","spec","qty"].forEach(field=>{
        const td=document.createElement("td");
        td.textContent=row[field];
        if(editMode){
          td.onclick=()=>editCell(td,boardIndex,rowIndex,field);
        }
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });

    boardDiv.appendChild(table);
    wrapper.appendChild(boardDiv);
  });
}

function editCell(cell,boardIndex,rowIndex,field){
  if(cell.querySelector("input")) return;

  const oldValue=data[currentZone][boardIndex][rowIndex][field];

  const input=document.createElement("input");
  input.value=oldValue;
  input.className="inline-edit";

  cell.textContent="";
  cell.appendChild(input);
  input.focus();

  input.onblur=async ()=>{
    const newValue=input.value.trim();
    const saved=await processChange(boardIndex,rowIndex,field,oldValue,newValue);
    cell.textContent=saved?data[currentZone][boardIndex][rowIndex][field]:oldValue;
  };
}

async function processChange(boardIndex,rowIndex,field,oldValue,newValue){
  const row=data[currentZone][boardIndex][rowIndex];

  if(field==="qty"){
    if(!row.code){
      alert("코드를 먼저 입력하세요");
      return false;
    }

    const diff=toNumber(newValue)-toNumber(oldValue);

    if(diff!==0){
      const type=diff>0?"IN":"OUT";
      const logRes=await fetch(SCRIPT_URL,{
        method:"POST",
        body:JSON.stringify({
          action:"logUsage",
          zone:currentZone,
          board:boardIndex+1,
          code:row.code,
          type:type,
          qty:Math.abs(diff)
        })
      });
      const logText=await logRes.text();
      if(logText!=="LOGGED") console.warn("logUsage 실패:",logText);
    }
  }

  row[field]=field==="qty"?String(toNumber(newValue)):newValue;
  dirtyMap[`${currentZone}-${boardIndex}-${rowIndex}`]=true;
  return true;
}

async function saveAll(){
  const keys=Object.keys(dirtyMap);
  if(keys.length===0) return;

  const failed=[];
  for(const key of keys){
    const [z,b,s]=key.split("-");
    const row=data[z][b][s];

    const updateRes=await fetch(SCRIPT_URL,{
      method:"POST",
      body:JSON.stringify({
        action:"updateSlot",
        zone:Number(z),
        board:Number(b)+1,
        slot_no:Number(s)+1,
        code:row.code,
        name:row.name,
        spec:row.spec,
        qty:row.qty
      })
    });
    const updateText=await updateRes.text();
    if(updateText!=="UPDATED" && updateText!=="CREATED"){
      console.warn("updateSlot 실패:",key,updateText);
      failed.push(`${key}:${updateText}`);
    }
  }
  if(failed.length){
    setStatus(`저장 실패 ${failed.length}건: ${failed[0]}`,"error");
    alert("저장 실패가 발생했습니다. 콘솔(F12)에서 실패 상세를 확인하세요.");
    return;
  }

  dirtyMap={};
  setStatus("저장 완료","ok");
}

document.getElementById("editBtn").onclick=async ()=>{
  editMode=!editMode;
  document.getElementById("editBtn").textContent=editMode?"완료":"편집";
  if(!editMode) await saveAll();
  render();
};

document.querySelectorAll(".zone-btn").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".zone-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentZone=Number(btn.dataset.zone);
    render();
  };
});

loadData();
</script>
</body>
</html>
